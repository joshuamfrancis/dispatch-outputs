AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Windows EC2 (MySQL pre-installed manually), Secrets Manager secret, VPC-attached
  Lambda rotation function, Secrets Manager VPC Interface Endpoint, and CloudTrail
  audit trail. Requires a pre-existing VPC and subnets.

# ================================================================
# PARAMETERS
# ================================================================
Parameters:

  # ── Pre-existing network ────────────────────────────────────────
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID of the existing VPC

  EC2SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet for the Windows EC2 instance (must have a route to the internet for RDP if needed)

  LambdaSubnetId1:
    Type: AWS::EC2::Subnet::Id
    Description: First private subnet for the Lambda rotation function

  LambdaSubnetId2:
    Type: AWS::EC2::Subnet::Id
    Description: Second private subnet for the Lambda rotation function (different AZ)

  # ── EC2 ──────────────────────────────────────────────────────────
  WindowsAMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-windows-latest/Windows_Server-2022-English-Full-Base
    Description: Windows Server 2022 AMI resolved from SSM Parameter Store

  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.medium, t3.large, m5.large]

  # ── MySQL credentials ────────────────────────────────────────────
  DBUsername:
    Type: String
    Default: appadmin
    Description: MySQL application username (must already exist on the MySQL instance)

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: >
      Initial MySQL password stored in Secrets Manager.
      MySQL must already be installed and this user must exist on the EC2 instance.

  DBName:
    Type: String
    Default: appdb
    Description: MySQL database name

  MySQLPort:
    Type: Number
    Default: 3306
    Description: MySQL listening port on the EC2 instance

  # ── Lambda ───────────────────────────────────────────────────────
  PyMySQLLayerArn:
    Type: String
    Description: >
      ARN of a Lambda Layer containing PyMySQL.
      Build with: pip install pymysql -t python/ && zip -r pymysql-layer.zip python/
      then: aws lambda publish-layer-version --layer-name pymysql
            --compatible-runtimes python3.12 --zip-file fileb://pymysql-layer.zip

  RotationIntervalDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: Automatic rotation frequency in days

# ================================================================
# RESOURCES
# ================================================================
Resources:

  # ---------------------------------------------------------------
  # Security Groups
  # ---------------------------------------------------------------

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Windows EC2 MySQL — allows MySQL from Lambda rotation function
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref MySQLPort
          ToPort: !Ref MySQLPort
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: MySQL from Lambda rotation function only
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: 0.0.0.0/0
          Description: RDP — RESTRICT TO YOUR ADMIN IP IN PRODUCTION
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-ec2-sg

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda secret rotation function
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !Ref MySQLPort
          ToPort: !Ref MySQLPort
          DestinationSecurityGroupId: !Ref EC2SecurityGroup
          Description: MySQL to EC2 instance
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationSecurityGroupId: !Ref SecretsManagerEndpointSG
          Description: HTTPS to Secrets Manager VPC endpoint
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-lambda-sg

  # Security group attached to the Secrets Manager VPC Interface Endpoint
  SecretsManagerEndpointSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Secrets Manager VPC Interface Endpoint
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: Allow Lambda to call Secrets Manager via endpoint
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-secretsmanager-endpoint-sg

  # ---------------------------------------------------------------
  # Secrets Manager VPC Interface Endpoint
  # Allows Lambda in private subnets to reach Secrets Manager
  # without traversing the internet or requiring a NAT Gateway.
  # ---------------------------------------------------------------

  SecretsManagerVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref LambdaSubnetId1
        - !Ref LambdaSubnetId2
      SecurityGroupIds:
        - !Ref SecretsManagerEndpointSG
      PrivateDnsEnabled: true

  # ---------------------------------------------------------------
  # EC2 IAM Role & Instance Profile
  # ---------------------------------------------------------------

  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-ec2-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadMySQLSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/mysql/*

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2InstanceRole

  # ---------------------------------------------------------------
  # Windows EC2 Instance
  # NOTE: MySQL installation is a manual post-provisioning step.
  # The UserData only signals CloudFormation success.
  # ---------------------------------------------------------------

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref WindowsAMI
      InstanceType: !Ref InstanceType
      SubnetId: !Ref EC2SubnetId
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 60
            VolumeType: gp3
            Encrypted: true
      UserData:
        Fn::Base64:
          Fn::Sub: |
            <powershell>
            # Signal CloudFormation that the instance is ready.
            # MySQL must be installed and configured manually after launch.
            cfn-signal.exe -e 0 --stack ${AWS::StackName} --resource EC2Instance --region ${AWS::Region}
            Write-Host "EC2 instance ready. Install and configure MySQL manually."
            </powershell>
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-windows-mysql
        - Key: OS
          Value: Windows
        - Key: Role
          Value: MySQL-Host

  # ---------------------------------------------------------------
  # Secrets Manager Secret
  # ---------------------------------------------------------------

  MySQLSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/mysql/credentials
      Description: >
        MySQL credentials for Windows EC2 instance.
        Rotated automatically by the Lambda rotation function.
      SecretString: !Sub |
        {
          "username": "${DBUsername}",
          "password": "${DBPassword}",
          "host": "${EC2Instance.PrivateIp}",
          "port": ${MySQLPort},
          "dbname": "${DBName}",
          "engine": "mysql"
        }
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-mysql-secret
        - Key: ManagedBy
          Value: SecretsManager

  SecretRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn: LambdaInvokePermission
    Properties:
      SecretId: !Ref MySQLSecret
      RotationLambdaARN: !GetAtt RotationLambda.Arn
      RotationRules:
        AutomaticallyAfterDays: !Ref RotationIntervalDays

  # ---------------------------------------------------------------
  # Lambda IAM Execution Role
  # ---------------------------------------------------------------

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-lambda-rotation-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Grants CreateNetworkInterface / DeleteNetworkInterface for VPC attachment
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: SecretsManagerRotation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowSecretAccess
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:UpdateSecretVersionStage
                Resource: !Ref MySQLSecret
              - Sid: AllowCloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-secret-rotation:*

  # ---------------------------------------------------------------
  # CloudWatch Log Group for Lambda
  # ---------------------------------------------------------------

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-secret-rotation
      RetentionInDays: 90

  # ---------------------------------------------------------------
  # Lambda Rotation Function (VPC-attached, private subnets)
  # ---------------------------------------------------------------

  RotationLambda:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-secret-rotation
      Description: Four-step Secrets Manager rotation for MySQL on Windows EC2
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 128
      Layers:
        - !Ref PyMySQLLayerArn
      VpcConfig:
        SubnetIds:
          - !Ref LambdaSubnetId1
          - !Ref LambdaSubnetId2
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Environment:
        Variables:
          AWS_REGION_NAME: !Ref AWS::Region
      Code:
        ZipFile: |
          """
          Secrets Manager four-step rotation for MySQL.
          Requires a Lambda Layer with pymysql installed.

          Steps:
            1. createSecret  - generate new password, store as AWSPENDING
            2. setSecret     - apply new password to MySQL
            3. testSecret    - verify new credentials connect
            4. finishSecret  - promote AWSPENDING to AWSCURRENT
          """
          import boto3
          import json
          import logging
          import os
          import secrets
          import string

          import pymysql

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          REGION = os.environ.get('AWS_REGION_NAME', 'us-east-1')


          def handler(event, context):
              secret_arn = event['SecretId']
              token      = event['ClientRequestToken']
              step       = event['Step']

              client = boto3.client('secretsmanager', region_name=REGION)

              metadata = client.describe_secret(SecretId=secret_arn)

              if not metadata.get('RotationEnabled', False):
                  raise ValueError(f"Rotation is not enabled for secret {secret_arn}")

              versions = metadata.get('VersionIdsToStages', {})
              if token not in versions:
                  raise ValueError(f"Version {token} not found in secret {secret_arn}")
              if 'AWSCURRENT' in versions[token]:
                  logger.info("Version %s is already AWSCURRENT — no action needed.", token)
                  return
              if 'AWSPENDING' not in versions[token]:
                  raise ValueError(f"Version {token} is not in AWSPENDING stage")

              dispatch = {
                  'createSecret': create_secret,
                  'setSecret':    set_secret,
                  'testSecret':   test_secret,
                  'finishSecret': finish_secret,
              }
              if step not in dispatch:
                  raise ValueError(f"Unknown rotation step: {step}")

              logger.info("Executing step: %s for secret: %s", step, secret_arn)
              dispatch[step](client, secret_arn, token)


          def create_secret(client, arn, token):
              try:
                  client.get_secret_value(SecretId=arn, VersionStage='AWSPENDING',
                                          VersionId=token)
                  logger.info("AWSPENDING already exists — skipping createSecret.")
                  return
              except client.exceptions.ResourceNotFoundException:
                  pass

              current = _get_secret(client, arn, 'AWSCURRENT')
              current['password'] = _generate_password()

              client.put_secret_value(
                  SecretId=arn,
                  ClientRequestToken=token,
                  SecretString=json.dumps(current),
                  VersionStages=['AWSPENDING'],
              )
              logger.info("createSecret: AWSPENDING version stored.")


          def set_secret(client, arn, token):
              pending = _get_secret(client, arn, 'AWSPENDING', token)
              current = _get_secret(client, arn, 'AWSCURRENT')

              conn = _connect(current)
              try:
                  with conn.cursor() as cur:
                      cur.execute(
                          "ALTER USER %s@'%%' IDENTIFIED BY %s",
                          (pending['username'], pending['password']),
                      )
                      cur.execute("FLUSH PRIVILEGES")
                  conn.commit()
                  logger.info("setSecret: MySQL password updated for user '%s'.",
                              pending['username'])
              finally:
                  conn.close()


          def test_secret(client, arn, token):
              pending = _get_secret(client, arn, 'AWSPENDING', token)
              conn = _connect(pending)
              try:
                  with conn.cursor() as cur:
                      cur.execute("SELECT 1")
                  logger.info("testSecret: new credentials verified — connection successful.")
              finally:
                  conn.close()


          def finish_secret(client, arn, token):
              metadata = client.describe_secret(SecretId=arn)
              old_current = next(
                  v for v, stages in metadata['VersionIdsToStages'].items()
                  if 'AWSCURRENT' in stages
              )
              if old_current == token:
                  logger.info("finishSecret: version already AWSCURRENT.")
                  return
              client.update_secret_version_stage(
                  SecretId=arn,
                  VersionStage='AWSCURRENT',
                  MoveToVersionId=token,
                  RemoveFromVersionId=old_current,
              )
              logger.info("finishSecret: AWSCURRENT promoted to version %s.", token)


          def _get_secret(client, arn, stage, version_id=None):
              kwargs = {'SecretId': arn, 'VersionStage': stage}
              if version_id:
                  kwargs['VersionId'] = version_id
              return json.loads(client.get_secret_value(**kwargs)['SecretString'])


          def _connect(secret):
              return pymysql.connect(
                  host=secret['host'],
                  port=int(secret.get('port', 3306)),
                  user=secret['username'],
                  password=secret['password'],
                  database=secret.get('dbname', ''),
                  connect_timeout=10,
                  cursorclass=pymysql.cursors.DictCursor,
              )


          def _generate_password(length=32):
              special = '!#$%&*+-=?@^_'
              alphabet = string.ascii_letters + string.digits + special
              while True:
                  pwd = ''.join(secrets.choice(alphabet) for _ in range(length))
                  if (any(c.islower() for c in pwd)
                          and any(c.isupper() for c in pwd)
                          and any(c.isdigit() for c in pwd)
                          and any(c in special for c in pwd)):
                      return pwd

      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-rotation-lambda

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt RotationLambda.Arn
      Action: lambda:InvokeFunction
      Principal: secretsmanager.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # ---------------------------------------------------------------
  # CloudTrail Audit Trail
  # ---------------------------------------------------------------

  AuditTrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub ${AWS::StackName}-audit-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveToGlacierAfter90Days
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: GLACIER
          - Id: DeleteAfter7Years
            Status: Enabled
            ExpirationInDays: 2555
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  AuditTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditTrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditTrailBucket.Arn
          - Sid: AllowCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${AuditTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  SecretsAuditTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: AuditTrailBucketPolicy
    Properties:
      TrailName: !Sub ${AWS::StackName}-secrets-audit-trail
      S3BucketName: !Ref AuditTrailBucket
      IsLogging: true
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: false
      EnableLogFileValidation: true
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-secrets-audit-trail

  # ---------------------------------------------------------------
  # CloudWatch Alarm — rotation failures
  # ---------------------------------------------------------------

  RotationFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-rotation-failure
      AlarmDescription: Lambda rotation function threw an error during secret rotation.
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref RotationLambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

# ================================================================
# OUTPUTS
# ================================================================
Outputs:

  EC2InstanceId:
    Description: EC2 Windows Instance ID
    Value: !Ref EC2Instance
    Export:
      Name: !Sub ${AWS::StackName}-ec2-id

  EC2PrivateIP:
    Description: EC2 Private IP (stored in secret host field)
    Value: !GetAtt EC2Instance.PrivateIp

  SecretARN:
    Description: Secrets Manager Secret ARN
    Value: !Ref MySQLSecret
    Export:
      Name: !Sub ${AWS::StackName}-secret-arn

  SecretName:
    Description: Secrets Manager Secret Name
    Value: !Sub ${AWS::StackName}/mysql/credentials

  RotationLambdaARN:
    Description: Rotation Lambda function ARN
    Value: !GetAtt RotationLambda.Arn

  LambdaLogGroup:
    Description: CloudWatch Log Group for rotation Lambda
    Value: !Ref LambdaLogGroup

  SecretsManagerVPCEndpointId:
    Description: Secrets Manager VPC Interface Endpoint ID
    Value: !Ref SecretsManagerVPCEndpoint

  AuditTrailBucket:
    Description: S3 bucket storing CloudTrail audit logs
    Value: !Ref AuditTrailBucket
